<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSync - Medical Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #007bb5;
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        main {
            flex: 1;
            max-width: 800px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            margin-bottom: 0.5rem;
        }
        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .btn-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            background-color: #007bb5;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #005b87;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>HealthSync</h1>
    </header>

    <main>
        <h2>Welcome to HealthSync</h2>
        <p>Your personalized portal for tracking medical records, symptoms, and health summary events.</p>

        <div class="btn-container">
            <a href="/login" class="btn">Log In</a>
            <a href="/register" class="btn btn-secondary">Register</a>
        </div>
    </main>

    <footer>
        &copy; 2026 HealthSync Application. All rights reserved.
    </footer>

</body>
</html>
