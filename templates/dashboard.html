<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSync - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        nav { background-color: #007bb5; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { font-size: 1.5rem; }
        nav a { color: white; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 4px; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .welcome-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-top: 4px solid #007bb5; }
        .card h3 { color: #555; font-size: 1rem; margin-bottom: 0.5rem; }
        .card p { font-size: 1.8rem; font-weight: bold; color: #007bb5; }
    </style>
</head>
<body>

    <nav>
        <h1>HealthSync Dashboard</h1>
        <a href="/logout">Logout</a>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h2>Welcome back!</h2>
            <p>Here is your current health summary overview.</p>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Medicines Tracked</h3>
                <p>0</p>
            </div>
            <div class="card">
                <h3>Symptoms Recorded</h3>
                <p>0</p>
            </div>
            <div class="card">
                <h3>Reports Uploaded</h3>
                <p>0</p>
            </div>
            <div class="card">
                <h3>Timeline Events</h3>
                <p>0</p>
            </div>
        </div>
    </div>

</body>
</html>
